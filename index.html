<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الواجبات</title>
<style>
:root{
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --card:rgba(255,255,255,.07); --card-br:rgba(255,255,255,.14);
  --text:#f1f2f6; --sub:rgba(241,242,246,.65);
  --accent:#8b5cf6; --accent2:#06b6d4; --accent3:#f472b6;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  color-scheme: dark;
}
body.light{
  --bg1:#e0e7ff; --bg2:#f0f9ff; --bg3:#fdf2f8;
  --card:rgba(255,255,255,.65); --card-br:rgba(99,102,241,.18);
  --text:#1e1b4b; --sub:rgba(30,27,75,.6);
  --shadow:0 18px 50px rgba(99,102,241,.18);
  color-scheme: light;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Tahoma,'Noto Kufi Arabic',sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  background-size:300% 300%; animation:bgShift 18s ease infinite;
  color:var(--text); min-height:100vh; overflow-x:hidden;
}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 18px 90px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.iconbtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--card-br);
  color:var(--text);transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.iconbtn:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 10px 24px rgba(139,92,246,.35)}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.glass{background:var(--card);border:1px solid var(--card-br);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero{text-align:center;padding:40px 26px;border-radius:28px;box-shadow:var(--shadow);margin-bottom:36px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,rgba(139,92,246,.18),transparent 30%);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:2.2rem;position:relative;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:10px;color:var(--sub);position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.hwcard{display:block;text-decoration:none;color:inherit;padding:24px;border-radius:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;opacity:0;transform:translateY(26px)}
.hwcard.in{opacity:1;transform:none}
.hwcard:hover{transform:translateY(-7px) scale(1.02);box-shadow:0 22px 60px rgba(139,92,246,.3)}
.hwcard:active{transform:scale(.95)}
.hwnum{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent3));box-shadow:0 6px 16px rgba(139,92,246,.4);margin-bottom:14px}
.hwcard h3{font-size:1.15rem;margin-bottom:6px}
.hwcard p{font-size:.85rem;color:var(--sub);margin-bottom:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;font-size:.72rem;font-weight:700}
.chip.open{background:rgba(52,211,153,.16);color:#34d399;border:1px solid rgba(52,211,153,.35)}
.chip.c2{background:rgba(6,182,212,.16);color:#22d3ee;border:1px solid rgba(6,182,212,.35)}
body.light .chip.c2{color:#0891b2}
.go{position:absolute;top:20px;left:20px;opacity:0;transition:.3s}
.hwcard:hover .go{opacity:1}
.go svg{width:18px;height:18px;stroke:var(--accent2);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.footer{text-align:center;margin-top:40px;color:var(--sub);font-size:.8rem}
@media(max-width:560px){.hero h1{font-size:1.5rem}}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="wrap">
  <div class="topbar">
    <span class="glass" style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:.85rem;font-weight:600">
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg>
      لوحة الواجبات
    </span>
    <div class="iconbtn" id="themeBtn" title="الوضع الليلي"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></div>
  </div>

  <div class="hero glass">
    <h1>📚 الواجبات</h1>
    <p>اختار الواجب وابدأ — بالتوفيق!</p>
  </div>

  <div class="grid" id="grid">
    <!-- ⬇️ لزوود واجب جديد: انسخ هذا البلوك وغيّر الرابط والعنوان ⬇️ -->
    <a class="hwcard glass" href="hw7.html">
      <div class="go"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
      <div class="hwnum">1</div>
      <h3>Homework 7</h3>
      <p>32 سؤال — اختيار من متعدد</p>
      <div class="meta"><span class="chip open">متاح الآن</span><span class="chip c2">معالجة كلمات</span></div>
    </a>
    <!-- ⬆️ END BLOCK ⬆️ -->
  </div>

  <div class="footer">إجاباتك تُسجَّل تلقائيًا في Google Forms ✨</div>
</div>
<script>
/* particles */
const cv=document.getElementById('particles'),cx=cv.getContext('2d');
let P=[];
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight}
sizeCv();addEventListener('resize',sizeCv);
const isLight=()=>document.body.classList.contains('light');
for(let i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2.4+.6,
  vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,h:Math.random()<.5?262:187});
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>cv.width)p.vx*=-1;
    if(p.y<0||p.y>cv.height)p.vy*=-1;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);
    cx.fillStyle=isLight()?'hsla('+p.h+',80%,55%,.22)':'hsla('+p.h+',85%,70%,.35)';
    cx.fill();
  }
  requestAnimationFrame(loop);
})();
document.getElementById('themeBtn').onclick=()=>{
  document.body.classList.toggle('light');
  document.getElementById('themeIcon').innerHTML=isLight()
    ?'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>'
    :'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
};
document.querySelectorAll('.hwcard').forEach((c,i)=>setTimeout(()=>c.classList.add('in'),120+i*110));
</script>
</body>
</html>
