<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
:root{
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --card:rgba(255,255,255,.07); --card-br:rgba(255,255,255,.14);
  --text:#f1f2f6; --sub:rgba(241,242,246,.65);
  --accent:#8b5cf6; --accent2:#06b6d4; --accent3:#f472b6;
  --ok:#34d399; --shadow:0 18px 50px rgba(0,0,0,.45);
  color-scheme: dark;
}
body.light{
  --bg1:#e0e7ff; --bg2:#f0f9ff; --bg3:#fdf2f8;
  --card:rgba(255,255,255,.65); --card-br:rgba(99,102,241,.18);
  --text:#1e1b4b; --sub:rgba(30,27,75,.6);
  --shadow:0 18px 50px rgba(99,102,241,.18);
  color-scheme: light;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Segoe UI',Tahoma,'Noto Kufi Arabic',sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  background-size:300% 300%; animation:bgShift 18s ease infinite;
  color:var(--text); min-height:100vh; overflow-x:hidden;
}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:32px 18px 90px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:26px}
.glass{background:var(--card);border:1px solid var(--card-br);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:.85rem;font-weight:600}
.badge svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--card-br);
  color:var(--text);transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.iconbtn:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 10px 24px rgba(139,92,246,.35)}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{text-align:center;padding:44px 26px;border-radius:28px;box-shadow:var(--shadow);margin-bottom:34px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,rgba(139,92,246,.18),transparent 30%);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:2.2rem;position:relative;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin-top:10px;color:var(--sub);position:relative}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;position:relative}
.chip{padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:700}
.chip.c1{background:rgba(139,92,246,.18);color:#a78bfa;border:1px solid rgba(139,92,246,.35)}
.chip.c2{background:rgba(6,182,212,.18);color:#22d3ee;border:1px solid rgba(6,182,212,.35)}
.chip.c3{background:rgba(244,114,182,.18);color:#f472b6;border:1px solid rgba(244,114,182,.35)}
body.light .chip.c1{color:#7c3aed}body.light .chip.c2{color:#0891b2}body.light .chip.c3{color:#db2777}
.progress{height:10px;border-radius:999px;overflow:hidden;margin:22px 0}
.progress .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .6s cubic-bezier(.34,1.3,.64,1);box-shadow:0 0 14px rgba(139,92,246,.6)}
.info-card{padding:26px;border-radius:22px;box-shadow:var(--shadow);margin-bottom:34px}
.info-card h2{font-size:1.1rem;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.info-card h2 svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{margin-bottom:16px}
.field label{display:block;font-size:.85rem;font-weight:700;margin-bottom:7px;color:var(--sub)}
.field input{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--card-br);outline:none;
  background:rgba(255,255,255,.06);color:var(--text);font-size:1rem;transition:.3s}
body.light .field input{background:rgba(255,255,255,.8)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.qcard{padding:24px;border-radius:22px;box-shadow:var(--shadow);margin-bottom:26px;
  opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1),box-shadow .3s}
.qcard.in{opacity:1;transform:none}
.qcard:hover{box-shadow:0 22px 60px rgba(139,92,246,.28);transform:translateY(-3px)}
.qhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.qnum{min-width:120px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;box-shadow:0 6px 16px rgba(139,92,246,.4);font-size:.9rem}
.qtext{font-weight:700;font-size:1.05rem;line-height:1.6;padding-top:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.opt{position:relative;padding:15px 12px;border-radius:16px;cursor:pointer;text-align:center;font-weight:800;
  border:2px solid var(--card-br);background:var(--card);backdrop-filter:blur(10px);user-select:none;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),border-color .3s,box-shadow .3s,background .3s;font-size:1.05rem}
.opt:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 14px 28px rgba(6,182,212,.25)}
.opt:active{transform:scale(.88)}
.opt .dot{position:absolute;top:8px;left:10px;width:18px;height:18px;border-radius:50%;border:2px solid var(--sub);transition:.3s}
.opt.sel{border-color:transparent;background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(6,182,212,.25));
  box-shadow:0 0 0 2.5px var(--accent),0 0 26px rgba(139,92,246,.5);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.opt.sel .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent)}
@keyframes pop{0%{transform:scale(.85)}55%{transform:scale(1.09)}100%{transform:scale(1)}}
.tanswer{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--card-br);outline:none;
  background:rgba(255,255,255,.06);color:var(--text);font-size:1.05rem;font-weight:600;transition:.3s}
body.light .tanswer{background:rgba(255,255,255,.8)}
.tanswer:focus{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(6,182,212,.16)}
.submitbar{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:36px}
.btn{padding:17px 60px;border:none;border-radius:999px;cursor:pointer;font-size:1.15rem;font-weight:800;color:#fff;
  background:linear-gradient(90deg,var(--accent),var(--accent2));background-size:200% 100%;
  box-shadow:0 14px 34px rgba(139,92,246,.45);transition:transform .4s cubic-bezier(.34,1.56,.64,1),background-position .6s}
.btn:hover{transform:translateY(-5px) scale(1.05);background-position:100% 0}
.btn:active{transform:scale(.92)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-left:8px}
.note{font-size:.85rem;color:var(--sub)}
.cf{position:fixed;width:10px;height:10px;z-index:99;pointer-events:none;border-radius:2px}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);padding:14px 26px;border-radius:16px;
  font-weight:700;z-index:100;transition:transform .55s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow)}
#toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:560px){.hero h1{font-size:1.5rem}.opts{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="wrap">
  <div class="topbar">
    <span class="badge glass"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 7.7l5.4-.8z"/></svg><span id="answeredCount">0 / __NQ__</span></span>
    <div style="display:flex;gap:10px">
      <div class="iconbtn" id="soundBtn" title="Sound"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></div>
      <div class="iconbtn" id="themeBtn" title="Dark Mode"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></div>
      <div class="iconbtn" id="fsBtn" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></div>
    </div>
  </div>

  <div class="hero glass">
    <h1>__TITLE__</h1>
    <p>Answer all questions then press Submit — Your answers are automatically saved to Google Forms</p>
    <div class="chips">
      <span class="chip c1">__NQ__ Questions</span>
      <span class="chip c2">Multiple Choice</span>
      <span class="chip c3">Auto Grading</span>
    </div>
  </div>

  <div class="progress glass"><div class="fill" id="pfill"></div></div>

  <div class="info-card glass">
    <h2><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Student Information</h2>
    <div class="field"><label for="f_name">Name *</label><input id="f_name" type="text" placeholder="Enter your name..." required></div>
    <div class="field"><label for="f_id">ID *</label><input id="f_id" type="text" placeholder="Enter your ID..." required></div>
  </div>

  <main id="questions">__QUESTIONS_HTML__</main>

  <div class="submitbar">
    <button class="btn" id="submitBtn">Submit Assignment<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    <span class="note">Make sure to answer all questions before submitting ✨</span>
  </div>
</div>

<div id="toast" class="glass"><span id="toastMsg">Submitted successfully!</span></div>
<iframe id="sink" name="sink" style="display:none"></iframe>
<form id="gform" action="__ACTION__" method="POST" target="sink" style="display:none"></form>

<script>
const QUESTIONS = __QUESTIONS_JSON__;
const FBZX = "__FBZX__";
const NAME_ENTRY = "__NAME_ENTRY__";
const ID_ENTRY = "__ID_ENTRY__";
const answers = {};
let soundOn = true;
let actx;
function beep(freq=520,dur=.12,type='sine',vol=.15){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sndSelect=()=>beep(660,.1,'sine');
const sndTick=()=>beep(440,.05,'triangle',.08);
const sndSuccess=()=>{beep(523,.15);setTimeout(()=>beep(659,.15),140);setTimeout(()=>beep(784,.3),280);};

const cv=document.getElementById('particles'), cx=cv.getContext('2d');
let P=[];
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight}
sizeCv(); addEventListener('resize',sizeCv);
const isLight=()=>document.body.classList.contains('light');
for(let i=0;i<70;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2.4+.6,
  vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,h:Math.random()<.5?262:187});
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const p of P){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>cv.width)p.vx*=-1;
    if(p.y<0||p.y>cv.height)p.vy*=-1;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);
    cx.fillStyle=isLight()?'hsla('+p.h+',80%,55%,.22)':'hsla('+p.h+',85%,70%,.35)';
    cx.fill();
  }
  requestAnimationFrame(loop);
})();

document.getElementById('themeBtn').onclick=()=>{
  document.body.classList.toggle('light');
  beep(isLight()?740:390,.12);
  document.getElementById('themeIcon').innerHTML = isLight()
    ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
};
document.getElementById('fsBtn').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
  beep(500,.1);
};
document.getElementById('soundBtn').onclick=e=>{
  soundOn=!soundOn;
  e.currentTarget.style.opacity=soundOn?1:.45;
  if(soundOn)beep(600,.1);
};

document.querySelectorAll('.qcard').forEach((card,i)=>setTimeout(()=>card.classList.add('in'),120+i*90));
document.querySelectorAll('.opt').forEach(el=>{
  el.addEventListener('click',()=>{
    const q=el.dataset.q;
    const grp=document.querySelectorAll('.opt[data-q="'+q+'"]');
    const wasSel=el.classList.contains('sel');
    grp.forEach(o=>o.classList.remove('sel'));
    if(!wasSel){el.classList.add('sel');answers[q]=el.dataset.v;sndSelect();}
    else{delete answers[q];sndTick();}
    updateProgress();
  });
});
document.querySelectorAll('.tanswer').forEach(inp=>{
  inp.addEventListener('input',()=>{answers[inp.dataset.q]=inp.value.trim();updateProgress();sndTick();});
});
['f_name','f_id'].forEach(id=>document.getElementById(id).addEventListener('input',updateProgress));
function infoOk(){return document.getElementById('f_name').value.trim() && document.getElementById('f_id').value.trim();}
function updateProgress(){
  const total=QUESTIONS.length+1;
  const done=Object.keys(answers).filter(k=>answers[k]).length+(infoOk()?1:0);
  document.getElementById('pfill').style.width=(done/total*100)+'%';
  document.getElementById('answeredCount').textContent=Object.keys(answers).filter(k=>answers[k]).length+' / '+QUESTIONS.length;
}
function confetti(){
  const colors=['#8b5cf6','#06b6d4','#f472b6','#34d399','#fbbf24'];
  for(let i=0;i<90;i++){
    const c=document.createElement('div');c.className='cf';
    c.style.background=colors[i%colors.length];
    c.style.left=Math.random()*100+'vw';c.style.top='-12px';
    document.body.appendChild(c);
    const dur=1400+Math.random()*1800, xdrift=(Math.random()-.5)*260;
    c.animate([{transform:'translateY(0) rotate(0)',opacity:1},
      {transform:'translate('+xdrift+'px,'+(innerHeight+80)+'px) rotate('+(540+Math.random()*540)+'deg)',opacity:.9}],
      {duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>c.remove();
  }
}
document.getElementById('submitBtn').onclick=()=>{
  if(!infoOk()){toast('⚠️ Please enter your name and ID');beep(220,.2,'square');return;}
  const missing=QUESTIONS.filter(q=>!answers[q.entry]);
  if(missing.length){toast('⚠️ '+missing.length+' questions still unanswered');beep(220,.2,'square');return;}
  const f=document.getElementById('gform');
  f.innerHTML='';
  const add=(n,v)=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;f.appendChild(i);};
  add(NAME_ENTRY,document.getElementById('f_name').value.trim());
  add(ID_ENTRY,document.getElementById('f_id').value.trim());
  add('fvv','1');add('pageHistory','0,1');add('fbzx',FBZX);add('submissionTimestamp','-1');
  for(const q of QUESTIONS)add(q.entry,answers[q.entry]);
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Submitting...';
  setTimeout(()=>{
    sndSuccess();confetti();
    toast('✅ Assignment submitted successfully!');
    document.querySelector('.hero h1').textContent='🎉 Great Job!';
    window.scrollTo({top:0,behavior:'smooth'});
  },900);
  f.submit();
};
function toast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3500);
}
updateProgress();
</script>
</body>
</html>
